<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="logo">
                    <i class="fas fa-camera"></i>
                    Smart Attendance
                </h1>
                <nav class="main-nav">
                    <a href="{{ url_for('dashboard_api.dashboard') }}" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="{{ url_for('views.registration_page') }}" class="nav-link">
                        <i class="fas fa-user-plus"></i> Register
                    </a>
                    <a href="{{ url_for('admin_api.admin_dashboard') }}" class="nav-link">
                        <i class="fas fa-cog"></i> Admin
                    </a>
                    <a href="{{ url_for('auth_api.logout') }}" class="nav-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div class="content-container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2023 Smart Attendance System. All rights reserved.</p>
        </footer>
    </div>
</body>

</html>
